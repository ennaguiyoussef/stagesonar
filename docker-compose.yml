# Pour l'instant : uniquement la base PostgreSQL.
# Les services backend et frontend seront ajoutés au jour 6.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stagesonar
      POSTGRES_PASSWORD: stagesonar
      POSTGRES_DB: stagesonar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
